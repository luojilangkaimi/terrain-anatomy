<!doctype html>
<!--
  view3d.html —— 成员二 · 三维地形独立演示页
  单独跑：双击项目根目录的 启动.bat（会自动开浏览器），或在 app 目录执行 python -m http.server 8000，
          访问 http://localhost:8000/view3d.html。直接双击本文件（file://）读不到 dem.bin 时，页面会让你选数据文件夹。
  冒烟：状态栏打出 min/max，应与 meta.json 一致（AOI1 1779.2/2519.0，AOI2 797.6/5057.9）。
  自检（T+125–140）：成员三的 hydro.js（window.Hydro）就位后，点「叠加河网」把河网贴到三维地表，转一圈检查无断头、无上坡；
                    再在山谷单击，流域以橙色叠加。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三维地形 · 成员二</title>
<style>
  html, body { margin: 0; height: 100%; font: 13px/1.5 system-ui, "Microsoft YaHei", sans-serif; background: #f4f5f7; color: #222; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 12px; background: #fff; border-bottom: 1px solid #ddd; }
  #bar label { display: inline-flex; align-items: center; gap: 4px; }
  #bar button { padding: 3px 9px; cursor: pointer; }
  #bar button:disabled { cursor: not-allowed; }
  #status, #fps { font-family: Consolas, monospace; font-size: 12px; color: #555; }
  #status.err { color: #b00020; }
  #wrap { position: absolute; top: var(--bar-h, 46px); left: 0; right: 0; bottom: 0; }
  #view { position: absolute; inset: 0; }
  #pick { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; flex-direction: column; gap: 10px; background: #f4f5f7; z-index: 5; text-align: center; padding: 16px; }
  #thr { width: 70px; }
</style>
</head>
<body>
<div id="bar">
  <label>数据 <select id="aoi"><option value="aoi1">AOI1 云大后山 30 m</option><option value="aoi2">AOI2 三江并流 90 m</option></select></label>
  <label>垂直夸大 <input id="ve" type="range" min="1" max="6" step="0.5" value="2"> <span id="veTxt">×2</span></label>
  <span>视角
    <button data-view="default">默认</button><button data-view="top">俯视</button><button data-view="nw">西北</button><button data-view="se">东南</button><button data-view="south">南侧低角</button>
  </span>
  <button id="spin">▶ 环绕</button>
  <label>网格 <select id="seg"><option value="512">512（一级）</option><option value="256">256（二级）</option></select></label>
  <label><input id="fog" type="checkbox" checked> 雾</label>
  <button id="shot">导出 PNG</button>
  <span>
    <button id="river" disabled title="需要成员三的 hydro.js">叠加河网</button>
    <label>阈值 <input id="thr" type="number" min="10" step="100" value="1000"> 像元</label>
    <button id="clr" disabled>清除叠加</button>
  </span>
  <span id="status">加载中…</span> <span id="fps"></span>
</div>
<div id="wrap">
  <div id="view"></div>
  <div id="pick">
    <div>浏览器不允许双击打开的页面直接读取本地 <code>dem.bin</code>。</div>
    <div>请选择数据文件夹（例如 <code>app/data/aoi1</code>），或双击项目根目录的 <code>启动.bat</code>。</div>
    <input id="dir" type="file" webkitdirectory multiple>
  </div>
</div>

<script src="lib/three.min.js"></script>
<!-- 成员一 / 成员三的公共模块：存在则优先使用，不存在时本页走回退（404 不影响运行） -->
<script src="js/palette.js" onerror="void 0"></script>
<script src="js/loader.js" onerror="void 0"></script>
<script src="js/terrain.js" onerror="void 0"></script>
<script src="js/hydro.js" onerror="void 0"></script>
<script src="js/orbit.js"></script>
<script src="js/render3d.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var R3 = window.Render3D;
  var statusEl = $('status');
  var current = null;   // {z, meta, aoi}
  var hydro = null;     // {dir, acc} 成员三算出的结果，按 AOI 缓存

  function fitBar() { document.documentElement.style.setProperty('--bar-h', $('bar').offsetHeight + 'px'); }
  function setStatus(msg, err) { statusEl.textContent = msg; statusEl.className = err ? 'err' : ''; fitBar(); }
  if (window.ResizeObserver) new ResizeObserver(fitBar).observe($('bar')); else window.addEventListener('resize', fitBar);
  fitBar();

  // —— 临时回退读取：仅在成员一的 loadDem 尚未交付或失败时使用 ——
  function fallbackLoad(base) {
    return Promise.all([
      fetch(base + 'meta.json').then(function (r) { if (!r.ok) throw new Error('meta.json ' + r.status); return r.json(); }),
      fetch(base + 'dem.bin').then(function (r) { if (!r.ok) throw new Error('dem.bin ' + r.status); return r.arrayBuffer(); })
    ]).then(function (res) { return { meta: res[0], z: toF32(res[1]) }; });
  }
  function toF32(buf) {
    var le = new Uint8Array(new Uint16Array([1]).buffer)[0] === 1;
    if (le) return new Float32Array(buf);
    var dv = new DataView(buf), n = buf.byteLength / 4, z = new Float32Array(n);
    for (var i = 0; i < n; i++) z[i] = dv.getFloat32(i * 4, true);
    return z;
  }
  function loadFromFiles(files) {
    var bin = null, metaF = null;
    for (var i = 0; i < files.length; i++) {
      if (/dem\.bin$/i.test(files[i].name)) bin = files[i];
      if (/meta\.json$/i.test(files[i].name)) metaF = files[i];
    }
    if (!bin || !metaF) return Promise.reject(new Error('文件夹里没找到 dem.bin 和 meta.json'));
    return Promise.all([metaF.text().then(JSON.parse), bin.arrayBuffer()])
      .then(function (r) { return { meta: r[0], z: toF32(r[1]) }; });
  }
  function validDem(d) { return d && d.z && d.meta && d.z.length === d.meta.width * d.meta.height; }

  // 契约没写 loadDem 是否异步、base 是否带结尾 '/'，两种都试，都不行再回退
  function load(aoi) {
    var base = 'data/' + aoi + '/';
    if (typeof window.loadDem !== 'function') return fallbackLoad(base);
    var tryOne = function (b) {
      return Promise.resolve().then(function () { return window.loadDem(b); })
        .then(function (d) { if (!validDem(d)) throw new Error('loadDem 返回格式不符'); return d; });
    };
    return tryOne(base).catch(function () { return tryOne(base.slice(0, -1)); })
      .catch(function (e) { console.warn('loadDem 失败，改用回退读取：', e); return fallbackLoad(base); });
  }

  function minmax(z) {
    var mn = Infinity, mx = -Infinity;
    for (var i = 0; i < z.length; i++) { var v = z[i]; if (v > -9000) { if (v < mn) mn = v; if (v > mx) mx = v; } }
    return [mn, mx];
  }

  // 成员三接口：优先 window.Hydro（成员三任务单版），兼容分工文档 §3.2 的分散全局函数
  var HY = null;
  if (window.Hydro && typeof window.Hydro.computeHydro === 'function') {
    HY = { name: 'Hydro.computeHydro',
      compute: function (z, w, h) { return window.Hydro.computeHydro(z, w, h); },
      river: window.Hydro.riverMask, ws: window.Hydro.watershed,
      snap: window.Hydro.snapOutlet || null, setMeta: window.Hydro.setMeta || null };
  } else if (['fillDepressions', 'd8', 'accumulate', 'riverMask'].every(function (f) { return typeof window[f] === 'function'; })) {
    HY = { name: '§3.2 全局函数',
      compute: function (z, w, h) { var d = window.d8(window.fillDepressions(z, w, h), w, h); return { dir: d, acc: window.accumulate(d, w, h) }; },
      river: window.riverMask, ws: typeof window.watershed === 'function' ? window.watershed : null, snap: null, setMeta: null };
  }
  var hasHydro = !!HY;
  if (hasHydro) { $('river').disabled = false; $('river').title = '调用成员三 ' + HY.name + '：填洼 → D8 → 汇流 → 河网'; }

  function onPick(r) {
    var msg = '单击：行 ' + r.iy + ' 列 ' + r.ix + '  高程 ' + r.elev.toFixed(1) + ' m（原生值）';
    if (hydro && HY && HY.ws) {
      try {
        var m = current.meta;
        // 点歪一两格常会落在河道旁的坡面上，先吸附到半径 5 格内汇流最大的格
        var o = HY.snap ? HY.snap(hydro.acc, m.width, m.height, r.ix, r.iy, 5) : [r.ix, r.iy];
        var ws = HY.ws(hydro.dir, m.width, m.height, o[0], o[1]);
        R3.setOverlay(ws.mask, { name: 'watershed', color: '#ff8c1a', alpha: 0.45, thicken: 0 });
        $('clr').disabled = false;
        msg += '  流域 ' + (+ws.area_km2).toFixed(2) + ' km²，出口 [' + ws.outlet.join(', ') + ']';
      } catch (e) { msg += '  流域计算失败：' + e.message; }
    }
    setStatus(msg);
  }

  function show(data, aoi) {
    if (!current || current.z !== data.z) hydro = null;
    current = { z: data.z, meta: data.meta, aoi: aoi };
    var mm = minmax(data.z), m = data.meta;
    if (HY && HY.setMeta) HY.setMeta(m);                      // 让流域面积用本区 cell_area_m2
    var ok = data.z.length === m.width * m.height &&
      Math.abs(mm[0] - m.elev.min) < 0.1 && Math.abs(mm[1] - m.elev.max) < 0.1;
    R3.mount3D($('view'), { z: data.z, meta: m, ve: +$('ve').value, segments: +$('seg').value, fog: $('fog').checked, onPick: onPick });
    $('clr').disabled = true;
    var info = R3.info();
    setStatus((ok ? '✔ ' : '✘ 数据不一致 ') + m.width + '×' + m.height +
      '  min ' + mm[0].toFixed(1) + ' / max ' + mm[1].toFixed(1) +
      '（meta ' + m.elev.min + ' / ' + m.elev.max + '）  网格 ' + info.segments.join('×') +
      '  构建 ' + info.buildMs + ' ms  色带 ' + info.paletteFrom, !ok);
    console.log('[3D 冒烟]', aoi, 'min', mm[0], 'max', mm[1], info);
  }

  function run() {
    var aoi = $('aoi').value;
    setStatus('加载 ' + aoi + ' …');
    load(aoi).then(function (d) { $('pick').style.display = 'none'; show(d, aoi); })
      .catch(function (e) {
        console.warn(e);
        if (location.protocol === 'file:') { $('pick').style.display = 'flex'; setStatus('file:// 下无法读取，请选择数据文件夹', true); }
        else setStatus('加载失败：' + e.message, true);
      });
  }

  $('dir').addEventListener('change', function (ev) {
    loadFromFiles(ev.target.files).then(function (d) {
      $('pick').style.display = 'none';
      var aoi = /aoi2/i.test(d.meta.name || '') || d.meta.width === 1800 ? 'aoi2' : 'aoi1';
      $('aoi').value = aoi; show(d, aoi);
    }).catch(function (e) { setStatus(e.message, true); });
  });

  $('aoi').addEventListener('change', run);
  $('seg').addEventListener('change', function () { current && show(current, current.aoi); });
  $('fog').addEventListener('change', function () { current && show(current, current.aoi); });
  $('ve').addEventListener('input', function () {
    var v = +this.value; $('veTxt').textContent = '×' + String(v).replace(/\.0$/, ''); R3.setVE(v);
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-view]'), function (b) {
    b.addEventListener('click', function () { R3.setView(b.getAttribute('data-view')); });
  });
  $('spin').addEventListener('click', function () { this.textContent = R3.spin() ? '⏸ 停止' : '▶ 环绕'; });
  $('shot').addEventListener('click', function () {
    var url = R3.screenshot(); if (!url) return;
    var a = document.createElement('a');
    a.href = url; a.download = '三维_' + (current ? current.aoi : 'dem') + '_VEx' + $('ve').value + '.png';
    document.body.appendChild(a); a.click(); a.remove();
  });

  // 河网叠加：调用成员三的纯函数（window.Hydro，兼容 §3.2），三维只负责显示
  $('river').addEventListener('click', function () {
    if (!current || !hasHydro) return;
    var m = current.meta, w = m.width, h = m.height, thr = +$('thr').value || 1000;
    setStatus('河网计算中（成员三 hydro.js）…');
    setTimeout(function () {
      try {
        var t0 = performance.now();
        if (!hydro) { var hr = HY.compute(current.z, w, h); hydro = { dir: hr.dir, acc: hr.acc }; }
        var mask = HY.river(hydro.acc, w, h, thr), n = 0;
        for (var i = 0; i < mask.length; i++) if (mask[i]) n++;
        R3.setOverlay(mask, { name: 'river', color: '#1e6fff', alpha: 0.95 });
        $('clr').disabled = false;
        setStatus('河网已叠加：阈值 ' + thr + ' 像元，河道像元 ' + n + '，耗时 ' + Math.round(performance.now() - t0) +
          ' ms。转一圈检查无断头、无上坡；在山谷单击可叠加流域。');
      } catch (e) { setStatus('河网计算失败：' + e.message, true); console.error(e); }
    }, 30);
  });
  $('clr').addEventListener('click', function () { R3.clearOverlay(); this.disabled = true; });

  // 每秒刷新一次帧率（环绕时才有意义；静止时按需渲染，不显示）
  setInterval(function () { var i = R3.info(); $('fps').textContent = i && i.fps ? '· ' + i.fps + ' fps' : ''; }, 1000);

  run();
})();
</script>
</body>
</html>
